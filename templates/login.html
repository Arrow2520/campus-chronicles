{% extends "base.html" %}
{% block title %}Login - Campus Chronicles{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold mb-6 text-center text-indigo-900">Welcome Back</h2>
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">Email or Roll No</label>
                <input type="text" id="identifier" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-indigo-900 text-white py-3 rounded-xl font-bold hover:bg-indigo-800 transition">Login</button>
        </form>
        <p class="text-center mt-4">Don't have an account? <a href="/signup" class="text-amber-600 font-bold">Sign Up</a></p>
    </div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('identifier').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_identifier: identifier, password: password})
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('role', data.role);
            window.location.href = '/';
        } else {
            alert(data.error);
        }
    });
</script>
{% endblock %}
