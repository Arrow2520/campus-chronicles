<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Campus Chronicles{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Lora', serif; background-color: #fafaf5; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .fade-in { animation: fadeIn 1.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

  <nav class="fixed top-0 w-full bg-indigo-950/95 backdrop-blur-md z-50 border-b border-amber-600/30" x-data="{ loggedIn: !!localStorage.getItem('token') }">
    <div class="container mx-auto px-6 py-4">
      <div class="flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-white">Campus Chronicles</a>
        <ul class="flex space-x-8 items-center">
          <li><a href="/" class="text-white hover:text-amber-300 transition">Home</a></li>
          <li><a href="/hostels" class="text-white hover:text-amber-300 transition">Hostels</a></li>
          <li><a href="/landmarks" class="text-white hover:text-amber-300 transition">Landmarks</a></li>

          <template x-if="!loggedIn">
              <li><a href="/login" class="bg-amber-600 px-4 py-2 rounded-full text-white font-bold hover:bg-amber-700 transition">Login</a></li>
          </template>
          <template x-if="loggedIn">
              <li><button @click="localStorage.clear(); window.location.reload()" class="text-red-400 hover:text-red-300 font-bold">Logout</button></li>
          </template>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow pt-20">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-indigo-950 text-white py-16 text-center mt-auto">
    <div class="container mx-auto px-6">
      <h2 class="text-4xl font-bold mb-4">Campus Chronicles</h2>
      <p class="text-xl max-w-3xl mx-auto leading-relaxed">Preserving the heritage and memories of IIEST Shibpur</p>
      <p class="mt-8 text-lg">© 2025 • Made with passion by IIEST students</p>
    </div>
  </footer>
</body>
</html>
