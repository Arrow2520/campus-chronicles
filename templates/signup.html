{% extends "base.html" %}
{% block title %}Sign Up - Campus Chronicles{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-bold mb-6 text-center text-indigo-900">Create Account</h2>
        <form id="signupForm" class="space-y-6">
            <div>
                <label class="block text-gray-700 font-bold mb-2">College Email</label>
                <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Roll Number</label>
                <input type="text" id="roll" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <button type="submit" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition">Sign Up</button>
        </form>
    </div>
</div>
<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const roll = document.getElementById('roll').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, roll_number: roll, password})
        });
        
        if (res.ok) {
            alert("Registration Successful! Please Login.");
            window.location.href = '/login';
        } else {
            const data = await res.json();
            alert(data.error);
        }
    });
</script>
{% endblock %}
