{% extends "base.html" %}

{% block title %}Landmarks - Campus Chronicles{% endblock %}

{% block content %}
  <script>
    const landmarksData = {{ landmarks | tojson | safe }};
  </script>

  <section class="py-20 px-6 max-w-7xl mx-auto min-h-screen"
    x-data="{
      searchQuery: '',
      landmarks: landmarksData,
      filteredLandmarks() {
        if (!this.searchQuery) return this.landmarks;
        const query = this.searchQuery.toLowerCase();
        return this.landmarks.filter(l =>
          l.name.toLowerCase().includes(query) ||
          l.description.toLowerCase().includes(query)
        );
      }
    }">

    <h2 class="text-4xl font-bold mb-8 text-indigo-900 text-center mt-10">Campus Landmarks</h2>

    <div class="max-w-2xl mx-auto mb-12">
      <input
        type="text"
        x-model="searchQuery"
        placeholder="🔍 Search landmarks..."
        class="w-full px-8 py-5 text-lg rounded-full shadow-2xl border-2 border-amber-600 focus:outline-none focus:ring-4 focus:ring-amber-300 transition"
      />
    </div>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
      <template x-for="landmark in filteredLandmarks()" :key="landmark.id">
        <article class="bg-white rounded-3xl shadow-2xl overflow-hidden hover:shadow-3xl transition-all duration-500 hover:-translate-y-3 fade-in">
          <img :src="landmark.image_url || 'https://via.placeholder.com/400x300?text=IIEST'"
               :alt="landmark.name"
               class="w-full h-80 object-cover">
          <div class="p-8">
            <h2 class="text-3xl font-bold mb-3 text-indigo-900" x-text="landmark.name"></h2>
            <p class="text-gray-700 leading-relaxed mb-5 line-clamp-3" x-text="landmark.description"></p>
            <div class="flex justify-between items-center">
              <a :href="'/place/' + landmark.slug" class="text-amber-600 font-bold text-lg hover:underline">
                View Details →
              </a>
              <span class="text-sm italic text-gray-500" x-text="landmark.category"></span>
            </div>
          </div>
        </article>
      </template>
    </div>

    <div x-show="filteredLandmarks().length === 0" class="text-center text-gray-500 text-xl mt-10">
        No landmarks found matching your search.
    </div>

  </section>
{% endblock %}
